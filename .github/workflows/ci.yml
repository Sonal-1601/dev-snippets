name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: |
          shopt -s nullglob
          files=(sh/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts yet"; exit 0; fi
          shellcheck "${files[@]}"

  js:
    name: node tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run tests
        run: |
          shopt -s nullglob
          files=(js/*.test.js)
          if [ ${#files[@]} -eq 0 ]; then echo "no tests yet"; exit 0; fi
          node --test js/*.test.js
